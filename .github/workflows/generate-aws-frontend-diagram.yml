name: Generate AWS Frontend Infrastructure Diagram

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to generate diagram for'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      include_resources:
        description: 'Include resource details in diagram'
        required: false
        default: true
        type: boolean
      output_format:
        description: 'Diagram output format'
        required: true
        default: 'svg'
        type: choice
        options:
          - svg
          - png
          - mermaid

env:
  PROJECT_NAME: 'quote-lambda-tf-frontend'
  WORKING_DIR: 'quote-lambda-tf-frontend/infrastructure'

jobs:
  generate-diagram:
    name: Generate AWS Architecture Diagram
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Pluralith
        run: |
          curl -fsSL https://api.pluralith.com/install.sh | bash
          echo "$HOME/.pluralith/bin" >> $GITHUB_PATH
          
      - name: Setup Pluralith License
        if: env.PLURALITH_LICENSE_KEY != ''
        run: |
          pluralith auth login --license-key "${{ secrets.PLURALITH_LICENSE_KEY }}"
        env:
          PLURALITH_LICENSE_KEY: ${{ secrets.PLURALITH_LICENSE_KEY }}
          
      - name: Terraform Init
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform init
          
      - name: Terraform Plan
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform plan -out=tfplan -var-file="terraform.tfvars"
          
      - name: Show Terraform Plan
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform show -json tfplan > plan.json
          
      - name: Generate Pluralith Diagram
        run: |
          cd ${{ env.WORKING_DIR }}
          pluralith diagram \
            --plan-file tfplan \
            --output-format ${{ github.event.inputs.output_format }} \
            --output-file "aws-architecture-${{ github.event.inputs.environment }}" \
            --show-resources ${{ github.event.inputs.include_resources }} \
            --theme aws \
            --title "Quote Lambda TF - Frontend Infrastructure (${{ github.event.inputs.environment }})" \
            --description "AWS architecture for quote-lambda-tf frontend deployment in ${{ github.event.inputs.environment }} environment"
            
      - name: Upload Diagram Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-architecture-diagram-${{ github.event.inputs.environment }}
          path: ${{ env.WORKING_DIR }}/aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}
          retention-days: 30
          
      - name: Create Diagram Summary
        id: diagram-summary
        run: |
          cd ${{ env.WORKING_DIR }}
          
          # Get diagram file size
          if [ -f "aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}" ]; then
            FILE_SIZE=$(stat -c%s "aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}")
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "📊 Diagram generated successfully!"
            echo "📁 File: aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}"
            echo "📏 Size: $FILE_SIZE bytes"
          else
            echo "❌ Diagram generation failed"
            exit 1
          fi
          
      - name: Comment on Pull Request (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './${{ env.WORKING_DIR }}/aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}';
            
            if (fs.existsSync(path)) {
              const fileStats = fs.statSync(path);
              const fileSize = fileStats.size;
              
              const comment = `## 🏗️ AWS Architecture Diagram Generated
              
              **Environment:** ${{ github.event.inputs.environment }}
              **Format:** ${{ github.event.inputs.output_format }}
              **File Size:** ${fileSize} bytes
              **Resources Included:** ${{ github.event.inputs.include_resources }}
              
              📊 Diagram has been generated and uploaded as an artifact.
              
              📥 Download the diagram from the workflow artifacts section.
              
              ---
              *Generated by Pluralith for Terraform infrastructure*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  create-release:
    name: Create Release with Diagram
    runs-on: ubuntu-latest
    needs: generate-diagram
    if: github.event.inputs.environment == 'prod'
    
    steps:
      - name: Download Diagram Artifact
        uses: actions/download-artifact@v4
        with:
          name: aws-architecture-diagram-prod
          path: ./diagrams
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: architecture-v${{ github.run_number }}
          name: AWS Architecture Diagram - Production
          body: |
            ## 🏗️ AWS Architecture Diagram
            
            **Environment:** Production
            **Generated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            This release contains the latest AWS architecture diagram for the quote-lambda-tf frontend infrastructure.
            
            ### 📊 Diagram Details:
            - Generated using Pluralith
            - Based on Terraform infrastructure
            - Includes all AWS resources
            - Production environment configuration
            
            ### 📥 Files:
            - `aws-architecture-prod.${{ github.event.inputs.output_format }}` - Main architecture diagram
            
            ---
            *Automatically generated by GitHub Actions workflow*
          files: ./diagrams/*
          draft: false
          prerelease: false

  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: generate-diagram
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download Diagram Artifact
        uses: actions/download-artifact@v4
        with:
          name: aws-architecture-diagram-${{ github.event.inputs.environment }}
          path: ./quote-lambda-tf-frontend/doc/diagrams
          
      - name: Update Documentation
        run: |
          # Create diagrams directory if it doesn't exist
          mkdir -p quote-lambda-tf-frontend/doc/diagrams
          
          # Update README with diagram link
          cat > quote-lambda-tf-frontend/doc/diagrams/README.md << 'EOF'
          # AWS Architecture Diagrams
          
          ## 📊 Generated Diagrams
          
          This directory contains automatically generated AWS architecture diagrams for the quote-lambda-tf frontend infrastructure.
          
          ### Available Diagrams
          
          | Environment | Format | Generated | Size |
          |-------------|--------|-----------|-------|
          | ${{ github.event.inputs.environment }} | ${{ github.event.inputs.output_format }} | ${{ github.event.head_commit.timestamp }} | $(stat -c%s quote-lambda-tf-frontend/doc/diagrams/aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}) bytes |
          
          ### 🏗️ Architecture Overview
          
          The AWS architecture includes:
          
          - **CloudFront Distribution** - CDN for static assets
          - **S3 Bucket** - Static website hosting
          - **Route 53** - DNS management
          - **AWS Certificate Manager** - SSL certificates
          - **CloudWatch** - Monitoring and logging
          - **IAM Roles** - Security and permissions
          
          ### 🔄 Generation Process
          
          Diagrams are generated using:
          - **Pluralith** - Infrastructure visualization tool
          - **Terraform Plan** - Infrastructure as code
          - **GitHub Actions** - Automated workflow
          
          ### 📚 Related Documentation
          
          - [Infrastructure Overview](../infrastructure/README.md)
          - [Deployment Guide](../deployment/README.md)
          - [AWS Configuration](../AWS/README.md)
          
          ---
          *Last updated: ${{ github.event.head_commit.timestamp }}*
          EOF
          
      - name: Commit and Push Documentation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add quote-lambda-tf-frontend/doc/diagrams/
          git diff --staged --quiet || git commit -m "📊 Update AWS architecture diagram for ${{ github.event.inputs.environment }} environment
          
          Generated diagram:
          - Environment: ${{ github.event.inputs.environment }}
          - Format: ${{ github.event.inputs.output_format }}
          - Size: $(stat -c%s quote-lambda-tf-frontend/doc/diagrams/aws-architecture-${{ github.event.inputs.environment }}.${{ github.event.inputs.output_format }}) bytes
          - Commit: ${{ github.sha }}
          
          [skip ci]"
          git push
