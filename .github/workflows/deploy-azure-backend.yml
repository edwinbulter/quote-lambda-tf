# Build and Deploy Azure Backend
#
# Required GitHub Secrets:
# 1. AZURE_CREDENTIALS - Service principal credentials in JSON format
#    Create with: az ad sp create-for-rbac --name "github-actions-quote-backend" --role contributor --scopes /subscriptions/SUBSCRIPTION_ID
#    Replace SUBSCRIPTION_ID with your actual subscription ID from: az account show --query id --output tsv
#    Convert the output to this format for the secret:
#    {
#      "clientId": "YOUR_APP_ID_HERE",
#      "clientSecret": "YOUR_PASSWORD_HERE",
#      "tenantId": "YOUR_TENANT_ID_HERE",
#      "subscriptionId": "YOUR_SUBSCRIPTION_ID_HERE"
#    }
#    Note: Map appId -> clientId, password -> clientSecret, tenant -> tenantId, and add subscriptionId
#
# 2. JWT_KEY - Secret key for signing JWT tokens (minimum 256 bits)
#    Generate with: openssl rand -base64 32
#    Or PowerShell: Add-Type -AssemblyName System.Web; [System.Web.Security.Membership]::GeneratePassword(32, 4)
#    IMPORTANT: Use a different key for production than development
#
# 3. JWT_ISSUER - Token issuer identifier
#    Production: "https://quote-backend-function.azurewebsites.net"
#    Development: "quote-azure-backend"
#
# 4. JWT_AUDIENCE - Token audience identifier
#    Production: "quote-azure-backend-users"
#    Development: "quote-azure-backend-users"
#
# 5. TABLE_STORAGE_CONNECTION_STRING - Azure Table Storage connection string
#    Format: "DefaultEndpointsProtocol=https;AccountName=YOUR_ACCOUNT;AccountKey=YOUR_KEY;EndpointSuffix=core.windows.net"
#
# Usage:
# 1. Add all secrets to GitHub repository (Settings > Secrets and variables > Actions)
# 2. Go to Actions tab > "Build and Deploy Azure Backend" > "Run workflow"
# 3. Run workflow (deploys to production only)
# 4. After deployment, create default users via API or AdminUserSeeder

name: Deploy Azure Backend

on:
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: quote-backend-function
  RESOURCE_GROUP: quote-backend-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x'
        
    - name: Restore dependencies
      run: dotnet restore quote-azure-backend/src/quote-azure-backend.csproj
      
    - name: Build project
      run: dotnet build quote-azure-backend/src --configuration Release --no-restore
      
    - name: Publish project
      run: dotnet publish quote-azure-backend/src --configuration Release --output ./publish
      
    - name: Login to Azure
      uses: azure/login@v1
      # Updated with client-secret for service principal authentication
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.FUNCTION_APP_NAME }}
        package: ./publish
        
    - name: Update App Settings
      run: |
        az functionapp config appsettings set --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.FUNCTION_APP_NAME }} --settings \
          "FUNCTIONS_WORKER_RUNTIME=dotnet-isolated" \
          "Jwt:Key=${{ secrets.JWT_KEY }}" \
          "Jwt:Issuer=${{ secrets.JWT_ISSUER }}" \
          "Jwt:Audience=${{ secrets.JWT_AUDIENCE }}" \
          "TableStorageConnectionString=${{ secrets.TABLE_STORAGE_CONNECTION_STRING }}"
          
    - name: Get Function Keys
      run: |
        echo "Checking available functions:"
        az functionapp function list --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.FUNCTION_APP_NAME }} --output table
        
        echo "Function App Keys (master key):"
        masterKey=$(az functionapp keys list --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.FUNCTION_APP_NAME }} --query masterKey --output tsv)
        echo "Master key: $masterKey"
        echo "FUNCTION_KEY=$masterKey" >> $GITHUB_ENV
          
    - name: Test Deployment
      run: |
        echo "Testing deployed endpoints..."
        # Test the function app root first
        curl -f "https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/" || exit 1
        
        echo "✅ Function App is responding"
        
    - name: Create Default Users (Optional)
      run: |
        echo "📝 Default users can be created via the AdminUserSeeder or API endpoints:"
        echo "   Admin: admin@quote-backend.local / Admin123!"
        echo "   Test User: user@example.com / User123!"
        echo ""
        echo "To create users via API:"
        echo "1. Register admin: POST https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/auth/register"
        echo "2. Login to get token: POST https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/auth/login"
        echo "3. Use token for authenticated requests"
        echo ""
        echo "⚠️  Remember to change default passwords after first login!"
        
    - name: Logout from Azure
      if: always()
      run: az logout

  
