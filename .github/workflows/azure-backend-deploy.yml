# Build and Deploy Azure Backend
#
# Required GitHub Secrets:
# 1. AZURE_CREDENTIALS - Service principal credentials for Azure authentication
#    Create with: az ad sp create-for-rbac --name "github-actions-quote-backend" --role contributor --scopes /subscriptions/SUBSCRIPTION_ID --sdk-auth
#
# 2. AZURE_SUBSCRIPTION_ID - Azure subscription ID
#    Get with: az account show --query id --output tsv
#
# Usage:
# 1. Add secrets to GitHub repository (Settings > Secrets and variables > Actions)
# 2. Go to Actions tab > "Build and Deploy Azure Backend" > "Run workflow"
# 3. Run workflow (deploys to production only)

name: Build and Deploy Azure Backend

on:
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: quote-backend-function
  RESOURCE_GROUP: quote-backend-rg

jobs:
  build-and-deploy:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x'
        
    - name: Restore dependencies
      run: dotnet restore quote-azure-backend/src/quote-azure-backend.csproj
      
    - name: Build project
      run: dotnet build quote-azure-backend/src --configuration Release --no-restore
      
    - name: Publish project
      run: dotnet publish quote-azure-backend/src --configuration Release --output ./publish
      
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.FUNCTION_APP_NAME }}
        package: ./publish
        
    - name: Update App Settings
      run: |
        az functionapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --settings "FUNCTIONS_WORKER_RUNTIME=dotnet-isolated"
          
    - name: Get Function Keys
      run: |
        echo "Function App Keys:"
        az functionapp function keys list \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --function-name quotes \
          --output table
          
    - name: Test Deployment
      run: |
        echo "Testing deployed endpoints..."
        # Test health endpoint
        curl -f "https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/system/status" || exit 1
        
        # Test quotes endpoint
        curl -f "https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/quotes" || exit 1
        
        echo "✅ All endpoints responding successfully"
        
    - name: Logout from Azure
      if: always()
      run: az logout

  # Optional: Run tests if they exist
  test:
    runs-on: windows-latest
    needs: build-and-deploy
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x'
        
    - name: Run Tests
      run: |
        if [ -f "quote-azure-backend/src/Tests/Tests.csproj" ]; then
          dotnet test quote-azure-backend/src/Tests --configuration Release --no-build --verbosity normal
        else
          echo "No test project found, skipping tests"
        fi
